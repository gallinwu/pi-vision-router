name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The vendored modules were cut from this upstream tag. Re-run
  # tools/make-vendor.mjs and bump DVR_REF together when refreshing vendor/.
  DVR_REF: v3.0.3

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # pi-coding-agent requires Node >=22.19 (its dist imports globSync);
        # importing it in tests inherits that floor.
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # sharp is a native module; this also proves the dependency set installs
      # cleanly from package-lock.json on all three platforms.
      - name: Install
        run: npm ci --no-audit --no-fund

      # Offline by design: the chain is served by test/mock-chain.mjs, so CI never
      # depends on the free OVH tier being up.
      - name: Test
        run: npm test

  # The vendored modules are generator output. A green job here means the committed
  # vendor tree still matches what make-vendor.mjs produces from upstream.
  vendor-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ysr666/dsh-vision-router
          ref: ${{ env.DVR_REF }}
          path: dsh-vision-router

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install package deps
        run: npm ci --no-audit --no-fund

      # The generator resolves the upstream clone via DVR_SRC/DVR_CAPTURE, so point
      # them at the sibling checkout made above (the default path assumes a parent-dir
      # layout that CI does not have).
      - name: Regenerate vendor
        env:
          DVR_SRC: ${{ github.workspace }}/dsh-vision-router/src/lib/core-primitives.js
          DVR_CAPTURE: ${{ github.workspace }}/dsh-vision-router/src/lib/windows-desktop-capture.js
        run: node tools/make-vendor.mjs

      - name: Fail on drift
        run: |
          git add -A extensions/vendor
          if git diff --cached --quiet; then
            echo "vendor tree is generator output, no drift"
          else
            echo "::error::extensions/vendor does not match tools/make-vendor.mjs output. Run: node tools/make-vendor.mjs"
            git diff --cached --stat
            exit 1
          fi
